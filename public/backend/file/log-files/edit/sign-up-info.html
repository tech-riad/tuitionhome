<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/fav.png" />
    <link rel="stylesheet" href="../../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../../css/color_palets.css" />
    <link rel="stylesheet" href="../../css/log_file_style.css" />
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/af-edit.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css"
      integrity="sha384-b6lVK+yci+bfDmaY1u0zE8YYJt0TZxLEAFyYSLHId4xoVvsrQu3INevFKo+Xir8e"
      crossorigin="anonymous"
    />

    <title>Admin - Affiliate - Log files</title>
  </head>
  <body>
    <!-- navbar starts here -->
    <nav
      class="navbar navbar-expand-lg bg-white shadow-lg fixed-top"
      data-bs-theme="dark"
    >
      <div class="container-fluid">
        <a href="/index.html"><img src="/images/logo.svg" alt="logo" /></a>
        <button
          class="navbar-toggler d-lg-none collapsed"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#sidebarMenu"
          aria-controls="navbarColor02"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <i class="bi bi-caret-down-fill"></i>
        </button>
      </div>
    </nav>
    <!-- navbar ends here -->
    <div class="container-fluid">
      <div class="row">
        <!-- sidebar starts here -->
        <nav
          id="sidebarMenu"
          class="col-md-3 col-lg-2 d-lg-block bg-white sidebar collapse sidebar-width shadow-lg"
          style="height: 100vh; margin-top: 60px; position: fixed"
        >
          <div
            class="d-flex justify-content-center align-items-center flex-column border-bottom mt-2 pb-3"
          >
            <div class="mb-2">
              <img
                src="/images/boy.jpg"
                alt="image"
                class="profile-img"
                style="
                  width: 80px;
                  height: 90px;
                  object-fit: cover;
                  margin-top: 16px;
                "
              />
            </div>
            <h5 class="text-gray-800 mt-3">Super Admin</h5>
          </div>
          <div style="overflow-y: auto; height: 65vh" class="scrollbar-none">
            <ul class="list-unstyled px-3 mt-2">
              <li class="mb-3">
                <div class="d-flex align-items-center">
                  <i class="bi bi-credit-card fs-5 me-4"></i>
                  <div class="d-flex w-100 justify-content-between">
                    <a
                      class="text-decoration-none text-gray-800 align-items-center collapsed"
                      data-bs-toggle="collapse"
                      data-bs-target="#offer-collapse"
                      aria-expanded="false"
                      style="cursor: pointer"
                    >
                      Affiliate
                    </a>
                    <i class="bi bi-chevron-left arrow-icon"></i>
                  </div>
                </div>

                <div class="collapse show" id="offer-collapse">
                  <ul class="btn-toggle-nav list-unstyled fw-normal pb-1 small">
                    <li
                      class="ms-4 px-3 py-1 my-3"
                      style="border-left: 3px solid #898e99"
                    >
                      <a
                        href="/index.html"
                        class="text-gray-800 text-decoration-none text-nowrap"
                        >Affiliate Request</a
                      >
                    </li>
                    <li
                      class="ms-4 px-3 py-1 my-3"
                      style="border-left: 3px solid #898e99"
                    >
                      <a
                        href="/affiliate-profile.html"
                        class="text-gray-800 text-decoration-none text-nowrap"
                        >Affiliate Profile</a
                      >
                    </li>
                    <li
                      class="ms-4 px-3 py-1 my-3"
                      style="border-left: 3px solid #898e99"
                    >
                      <a
                        href="/affiliate-transaction.html"
                        class="text-gray-800 text-decoration-none text-nowrap"
                        >Affiliate Transaction</a
                      >
                    </li>
                    <li
                      class="ms-4 px-3 py-1 my-3"
                      style="border-left: 3px solid #898e99"
                    >
                      <a
                        href="/setting.html"
                        class="text-gray-800 text-decoration-none"
                        >Setting</a
                      >
                    </li>
                  </ul>
                </div>
              </li>
            </ul>
          </div>
        </nav>
        <!-- sidebar ends here -->
        <main class="container-custom">
          <div
            class="col-lg-9 ms-sm-auto col-lg-10 px-3"
            style="margin-top: 62px"
          >
            <!-- tab like button group (it should be tab) -->
            <div class="pt-4 row row-cols-2">
              <div>
                <a
                  href="/log-files/view/aboutme.html"
                  class="btn bg-white shadow-lg w-100"
                  style="
                    border: 2px solid white;
                    color: #6c6d6d;
                    font-size: 16px;
                    padding-top: 12px;
                    padding-bottom: 12px;
                  "
                  >View</a
                >
              </div>
              <div>
                <a
                  href="/log-files/edit/sign-up-info.html"
                  class="btn bg-white shadow-lg w-100"
                  style="
                    border: 2px solid #669ad1;
                    color: #6c6d6d;
                    font-size: 16px;
                    padding-top: 12px;
                    padding-bottom: 12px;
                  "
                  >Edit</a
                >
              </div>
            </div>
            <!-- tab like button group ends -->
            <!-- contents starts here -->
            <div class="row gx-1 gx-lg-4 my-lg-4 mt-4 mt-lg-4">
              <div class="col-12 col-xl-3 col-lg-4">
                <div
                  class="bg-white rounded-3 shadow-lg"
                  style="max-height: 400"
                >
                  <ul
                    class="ps-0 d-flex flex-lg-column justify-content-between px-2"
                  >
                    <li
                      class="setting-nav-item px-xl-4 px-lg-2 d-flex justify-content-center justify-content-lg-start align-items-center"
                    >
                      <a
                        class="t-link text-primary d-none d-lg-block text-nowrap text-decoration-none"
                        href="/log-files/edit/sign-up-info.html"
                      >
                        <i class="bi bi-person-fill mx-2"></i>Sign-up
                        Information
                      </a>
                      <a
                        class="t-link d-lg-none d-block"
                        href="/log-files/edit/sign-up-info.html"
                      >
                        <i class="bi bi-person-fill mx-2 fs-1"></i>
                      </a>
                    </li>

                    <li
                      class="setting-nav-item px-xl-4 px-lg-2 d-flex justify-content-center justify-content-lg-start align-items-center"
                    >
                      <a
                        class="t-link d-none d-lg-block text-nowrap text-decoration-none"
                        href="/log-files/edit/others-info.html"
                      >
                        <i class="bi bi-person-vcard-fill mx-2"></i>Others
                        Information
                      </a>
                      <a
                        class="t-link d-lg-none d-block"
                        href="/log-files/edit/others-info.html"
                      >
                        <i class="bi bi-bell-fill mx-2 fs-1"></i>
                      </a>
                    </li>

                    <li
                      class="setting-nav-item px-xl-4 px-lg-2 d-flex justify-content-center justify-content-lg-start align-items-center"
                    >
                      <a
                        class="t-link d-none d-lg-block text-nowrap text-decoration-none"
                        href="/log-files/edit/password.html"
                      >
                        <i class="bi bi-shield-lock-fill mx-2"></i>Password &
                        Security
                      </a>
                      <a
                        class="t-link d-lg-none d-block"
                        href="/log-files/edit/password.html"
                      >
                        <i class="bi bi-shield-lock-fill mx-2 fs-1"></i>
                      </a>
                    </li>
                    <li
                      class="setting-nav-item px-xl-4 px-lg-2 d-flex justify-content-center justify-content-lg-start align-items-center"
                    >
                      <a
                        class="t-link d-none d-lg-block text-nowrap text-decoration-none"
                        href="/log-files/edit/payment.html"
                      >
                        <i class="bi bi-wallet-fill mx-2"></i> Payment Method
                      </a>
                      <a
                        class="t-link d-lg-none d-block"
                        href="/log-files/edit/payment.html"
                      >
                        <i class="bi bi-slack mx-2 fs-1"></i>
                      </a>
                    </li>
                    <li
                      class="setting-nav-item px-xl-4 px-lg-2 d-flex justify-content-center justify-content-lg-start align-items-center"
                    >
                      <a
                        class="t-link d-none d-lg-block text-nowrap text-decoration-none"
                        href="/log-files/edit/account.html"
                      >
                        <i class="bi bi-gear-fill mx-2"></i>Accounts Status
                      </a>
                      <a
                        class="t-link d-lg-none d-block"
                        href="/log-files/edit/account.html"
                      >
                        <i class="bi bi-gear-fill mx-2 fs-1"></i>
                      </a>
                    </li>
                  </ul>
                </div>
              </div>
              <div class="col-12 col-xl-9 col-lg-8">
                <!-- settings content starts here -->
                <div>
                  <div
                    class="d-flex gap-4 flex-wrap justify-content-center align-items-center"
                  >
                    <div
                      class="d-flex justify-content-center align-items-center flex-column gap-4"
                    >
                      <div class="text-gray-500">
                        <i class="bi bi-1-circle-fill fs-3"></i>
                      </div>
                      <div>
                        <button
                          class="btn btn-secondary shadow-lg fs-4 text-gray-800 px-5 py-4"
                          data-bs-toggle="modal"
                          data-bs-target="#nameModel"
                          style="border-left: 5px solid #3b3c3d"
                        >
                          <i
                            class="bi bi-person-circle text-primary me-2 fs-3"
                          ></i>
                          Name
                        </button>
                      </div>
                    </div>

                    <div
                      class="d-flex justify-content-center align-items-center flex-column gap-4"
                    >
                      <div class="text-primary">
                        <i class="bi bi-2-circle-fill fs-3"></i>
                      </div>
                      <div>
                        <button
                          class="btn btn-secondary shadow-lg fs-4 text-gray-800 px-5 py-4"
                          data-bs-toggle="modal"
                          data-bs-target="#phoneModel"
                          style="border-left: 5px solid #3b3c3d"
                        >
                          <i
                            class="bi bi-telephone-fill text-primary me-2 fs-3"
                          ></i>
                          Phone
                        </button>
                      </div>
                    </div>
                    <div
                      class="d-flex justify-content-center align-items-center flex-column gap-4"
                    >
                      <div class="text-primary">
                        <i class="bi bi-3-circle-fill fs-3"></i>
                      </div>
                      <div>
                        <button
                          class="btn btn-secondary shadow-lg fs-4 text-gray-800 px-5 py-4"
                          data-bs-toggle="modal"
                          data-bs-target="#emailModel"
                          style="border-left: 5px solid #3b3c3d"
                        >
                          <i
                            class="bi bi-envelope-open-fill text-primary me-2 fs-4"
                          ></i>
                          Email
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                <section>
                  <div
                    class="modal fade"
                    id="nameModel"
                    tabindex="-1"
                    aria-labelledby="exampleModalLabel"
                    aria-hidden="true"
                  >
                    <div class="modal-dialog modal-dialog-centered">
                      <div class="modal-content p-2">
                        <div class="modal-header">
                          <h1 class="modal-title fs-5" id="exampleModalLabel">
                            Update Name
                          </h1>
                          <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"
                          ></button>
                        </div>
                        <div class="modal-body pb-2">
                          <input
                            type="text"
                            class="form-control shadow-none input-lg rounded"
                            placeholder="Enter your name"
                          />
                          <!-- <p class="fs-12 text-danger mb-0">Error Message</p>  -->
                        </div>
                        <div class="modal-footer">
                          <button class="d-none" data-bs-dismiss="modal">
                            close
                          </button>
                          <button type="button" class="btn btn-primary">
                            Save
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>
                <section>
                  <div
                    class="modal fade"
                    id="phoneModel"
                    tabindex="-1"
                    aria-labelledby="exampleModalLabel"
                    aria-hidden="true"
                  >
                    <div class="modal-dialog modal-dialog-centered">
                      <div class="modal-content p-2">
                        <div class="modal-header">
                          <h1 class="modal-title fs-5" id="exampleModalLabel">
                            Update Phone
                          </h1>
                          <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"
                          ></button>
                        </div>
                        <div class="modal-body pb-2">
                          <input
                            type="text"
                            class="form-control shadow-none input-lg rounded"
                            placeholder="Enter your phone number"
                          />
                          <!-- <p class="fs-12 text-danger mb-0">Error message</p>  -->
                        </div>
                        <div class="modal-footer">
                          <button class="d-none" data-bs-dismiss="modal">
                            close
                          </button>
                          <button type="button" class="btn btn-primary">
                            Save
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>
                <section>
                  <div
                    class="modal fade"
                    id="emailModel"
                    tabindex="-1"
                    aria-labelledby="exampleModalLabel"
                    aria-hidden="true"
                  >
                    <div class="modal-dialog modal-dialog-centered">
                      <div class="modal-content p-2">
                        <div class="modal-header">
                          <h1 class="modal-title fs-5" id="exampleModalLabel">
                            Update Email
                          </h1>
                          <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"
                          ></button>
                        </div>
                        <div class="modal-body pb-2">
                          <input
                            type="text"
                            class="form-control shadow-none input-lg rounded"
                            placeholder="Enter your email"
                          />
                          <!-- <p class="fs-12 text-danger mb-0">Error message</p> -->
                        </div>
                        <div
                          class="modal-footer d-flex justify-content-between"
                        >
                          <button type="button" class="btn btn-warning">
                            Verify Email
                          </button>
                          <div class="">
                            <button class="d-none" data-bs-dismiss="modal">
                              close
                            </button>
                            <button type="button" class="btn btn-primary">
                              Save
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>
                <!-- settings content ends here -->
              </div>
            </div>
            <!-- contents ends here -->
          </div>
        </main>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
